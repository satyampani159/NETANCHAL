# Render Blueprint: New > Blueprint > pick this repo. No Docker needed: Render runs the server folder directly.
services:
  - type: web
    name: netanchal-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      # set this in the Render dashboard to your website's address, e.g. https://netanchal.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
